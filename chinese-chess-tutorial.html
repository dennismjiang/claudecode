<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Chinese Chess (Xiangqi) - Interactive Tutorial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        .chinese-title {
            font-size: 1.5rem;
            color: #e94560;
            margin-bottom: 5px;
        }

        /* Chat Container */
        .chat-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(233, 69, 96, 0.5);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-message {
            display: flex;
            gap: 15px;
        }

        .bot-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .bot-content {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 0 15px 15px 15px;
            max-width: calc(100% - 60px);
            line-height: 1.7;
        }

        .bot-content h3 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .bot-content p {
            margin-bottom: 15px;
        }

        .bot-content ul {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .bot-content li {
            margin-bottom: 8px;
        }

        .highlight {
            color: #ff6b6b;
            font-weight: 600;
        }

        /* Diagram Container */
        .diagram-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .diagram-container svg {
            max-width: 100%;
            height: auto;
        }

        .diagram-caption {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #a0a0a0;
            font-style: italic;
        }

        /* Chess Board Styles */
        .board-line {
            stroke: #c4a35a;
            stroke-width: 1.5;
        }

        .board-bg {
            fill: #f5deb3;
        }

        .river-text {
            font-family: 'KaiTi', 'SimKai', serif;
            font-size: 18px;
            fill: #4a7c59;
        }

        .palace-line {
            stroke: #c4a35a;
            stroke-width: 1;
        }

        .piece-circle {
            stroke-width: 2;
        }

        .red-piece {
            fill: #fff8dc;
            stroke: #c41e3a;
        }

        .black-piece {
            fill: #fff8dc;
            stroke: #1a1a1a;
        }

        .red-text {
            fill: #c41e3a;
            font-family: 'KaiTi', 'SimKai', serif;
            font-weight: bold;
        }

        .black-text {
            fill: #1a1a1a;
            font-family: 'KaiTi', 'SimKai', serif;
            font-weight: bold;
        }

        .move-indicator {
            fill: rgba(76, 175, 80, 0.4);
            stroke: #4caf50;
            stroke-width: 2;
        }

        .move-arrow {
            stroke: #4caf50;
            stroke-width: 3;
            fill: none;
            marker-end: url(#arrowhead);
        }

        /* Navigation */
        .lesson-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .lesson-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #e8e8e8;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .lesson-btn:hover {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }

        .lesson-btn.active {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-color: transparent;
            color: white;
        }

        /* Progress */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        /* Continue Button */
        .continue-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }

        /* Quick Reference */
        .quick-ref {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .quick-ref h2 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .piece-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .piece-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .piece-icon {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }

        .piece-info h4 {
            color: #ff6b6b;
            margin-bottom: 5px;
        }

        .piece-info p {
            font-size: 0.85rem;
            color: #a0a0a0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .chat-container {
                padding: 20px;
            }

            .bot-content {
                padding: 15px;
            }

            .lesson-btn {
                padding: 10px 15px;
                font-size: 0.85rem;
            }
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px 15px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #e94560;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .hidden {
            display: none;
        }

        /* Language Toggle */
        .lang-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .lang-toggle span {
            font-size: 0.9rem;
            color: #a0a0a0;
            transition: color 0.3s;
        }

        .lang-toggle span.active {
            color: #ff6b6b;
            font-weight: 600;
        }

        .toggle-switch {
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }

        .toggle-switch.zh::after {
            transform: translateX(24px);
        }

        .container {
            position: relative;
        }

        @media (max-width: 768px) {
            .lang-toggle {
                position: static;
                justify-content: center;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-toggle">
            <span id="langEn" class="active">EN</span>
            <div class="toggle-switch" id="langToggle"></div>
            <span id="langZh">中文</span>
        </div>

        <header>
            <div class="chinese-title">象棋教程</div>
            <h1 id="mainTitle">Learn Chinese Chess</h1>
            <p id="subtitle">An interactive guide to mastering Xiangqi</p>
        </header>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">Lesson 1 of 8</div>
        </div>

        <nav class="lesson-nav" id="lessonNav">
            <button class="lesson-btn active" data-lesson="0">Welcome</button>
            <button class="lesson-btn" data-lesson="1">The Board</button>
            <button class="lesson-btn" data-lesson="2">General</button>
            <button class="lesson-btn" data-lesson="3">Advisors</button>
            <button class="lesson-btn" data-lesson="4">Elephants</button>
            <button class="lesson-btn" data-lesson="5">Horses</button>
            <button class="lesson-btn" data-lesson="6">Chariots</button>
            <button class="lesson-btn" data-lesson="7">Cannons</button>
            <button class="lesson-btn" data-lesson="8">Soldiers</button>
            <button class="lesson-btn" data-lesson="9">Rules</button>
            <button class="lesson-btn" data-lesson="10">Openings</button>
            <button class="lesson-btn" data-lesson="11">Tactics</button>
            <button class="lesson-btn" data-lesson="12">Checkmates</button>
            <button class="lesson-btn" data-lesson="13">Defense</button>
            <button class="lesson-btn" data-lesson="14">Endgame</button>
        </nav>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be inserted here -->
            </div>
            <button class="continue-btn" id="continueBtn">Continue to Next Lesson</button>
        </div>

        <div class="quick-ref">
            <h2 id="quickRefTitle">Quick Reference - All Pieces</h2>
            <div class="piece-grid" id="pieceGrid">
                <!-- Generated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Lesson content with diagrams
        const lessons = [
            // Lesson 0: Welcome
            {
                title: "Welcome to Chinese Chess!",
                content: `
                    <h3>Welcome to Chinese Chess! 欢迎学习象棋!</h3>
                    <p>Hello! I'm excited to teach you <span class="highlight">Xiangqi (象棋)</span>, also known as Chinese Chess. This ancient game has been played for over a thousand years and remains one of the most popular board games in the world.</p>
                    <p>Chinese Chess is similar to Western Chess in some ways - you have two armies facing each other, and the goal is to checkmate the opponent's king (called the <span class="highlight">General</span>). But it has unique features that make it fascinating:</p>
                    <ul>
                        <li><strong>The River</strong> - A boundary that affects piece movement</li>
                        <li><strong>The Palace</strong> - A special zone for the General and Advisors</li>
                        <li><strong>The Cannon</strong> - A unique piece that jumps to capture</li>
                        <li><strong>Pieces on intersections</strong> - Not inside squares!</li>
                    </ul>
                    <p>Let's begin your journey to mastering this beautiful game!</p>
                `
            },
            // Lesson 1: The Board
            {
                title: "The Board",
                content: `
                    <h3>Understanding the Board</h3>
                    <p>The Chinese Chess board is a <span class="highlight">9×10 grid</span> of lines. Unlike Western Chess where pieces sit inside squares, in Xiangqi pieces are placed on the <span class="highlight">intersections</span> of lines.</p>
                    <div class="diagram-container">
                        <svg viewBox="0 0 400 440" width="400" height="440">
                            <!-- Board background -->
                            <rect x="20" y="20" width="360" height="400" class="board-bg" rx="5"/>

                            <!-- Horizontal lines -->
                            ${[...Array(10)].map((_, i) => `<line x1="40" y1="${40 + i * 40}" x2="360" y2="${40 + i * 40}" class="board-line"/>`).join('')}

                            <!-- Vertical lines (with river gap) -->
                            ${[...Array(9)].map((_, i) => {
                                if (i === 0 || i === 8) {
                                    return `<line x1="${40 + i * 40}" y1="40" x2="${40 + i * 40}" y2="400" class="board-line"/>`;
                                }
                                return `
                                    <line x1="${40 + i * 40}" y1="40" x2="${40 + i * 40}" y2="200" class="board-line"/>
                                    <line x1="${40 + i * 40}" y1="240" x2="${40 + i * 40}" y2="400" class="board-line"/>
                                `;
                            }).join('')}

                            <!-- Palace diagonals - Top -->
                            <line x1="160" y1="40" x2="240" y2="120" class="palace-line"/>
                            <line x1="240" y1="40" x2="160" y2="120" class="palace-line"/>

                            <!-- Palace diagonals - Bottom -->
                            <line x1="160" y1="320" x2="240" y2="400" class="palace-line"/>
                            <line x1="240" y1="320" x2="160" y2="400" class="palace-line"/>

                            <!-- River text -->
                            <text x="100" y="225" class="river-text">楚 河</text>
                            <text x="260" y="225" class="river-text">漢 界</text>

                            <!-- Labels -->
                            <text x="200" y="15" text-anchor="middle" fill="#666" font-size="12">Black's Side</text>
                            <text x="200" y="435" text-anchor="middle" fill="#666" font-size="12">Red's Side</text>

                            <!-- Palace highlight -->
                            <rect x="158" y="38" width="84" height="84" fill="rgba(233, 69, 96, 0.1)" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5"/>
                            <rect x="158" y="318" width="84" height="84" fill="rgba(233, 69, 96, 0.1)" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5"/>
                        </svg>
                        <div class="diagram-caption">The Xiangqi board with the River (楚河 漢界) in the middle and Palaces highlighted</div>
                    </div>
                    <p>Key features of the board:</p>
                    <ul>
                        <li><strong>The River (楚河 漢界)</strong> - The blank space in the middle. It affects how Elephants and Soldiers move.</li>
                        <li><strong>The Palace</strong> - The 3×3 area marked with diagonal lines. The General and Advisors must stay inside.</li>
                        <li><strong>90 intersection points</strong> - That's where all the action happens!</li>
                    </ul>
                `
            },
            // Lesson 2: General
            {
                title: "The General",
                content: `
                    <h3>The General (帥/將)</h3>
                    <p>The General is the <span class="highlight">most important piece</span> - like the King in Western Chess. If your General is checkmated, you lose!</p>
                    <p>Red's General is called <span class="highlight">帥 (Shuài)</span> and Black's is <span class="highlight">將 (Jiàng)</span>.</p>
                    <div class="diagram-container">
                        <svg viewBox="0 0 200 200" width="200" height="200">
                            <!-- Mini palace -->
                            <rect x="20" y="20" width="160" height="160" fill="#f5deb3" rx="5"/>
                            <line x1="40" y1="40" x2="160" y2="40" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="40" y1="100" x2="160" y2="100" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="40" y1="160" x2="160" y2="160" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="40" y1="40" x2="40" y2="160" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="100" y1="40" x2="100" y2="160" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="160" y1="40" x2="160" y2="160" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="40" y1="40" x2="160" y2="160" stroke="#c4a35a" stroke-width="1"/>
                            <line x1="160" y1="40" x2="40" y2="160" stroke="#c4a35a" stroke-width="1"/>

                            <!-- Move indicators -->
                            <circle cx="100" cy="40" r="12" class="move-indicator"/>
                            <circle cx="40" cy="100" r="12" class="move-indicator"/>
                            <circle cx="160" cy="100" r="12" class="move-indicator"/>
                            <circle cx="100" cy="160" r="12" class="move-indicator"/>

                            <!-- General piece -->
                            <circle cx="100" cy="100" r="25" class="red-piece piece-circle"/>
                            <text x="100" y="108" text-anchor="middle" font-size="24" class="red-text">帥</text>
                        </svg>
                        <div class="diagram-caption">The General moves one space orthogonally (up, down, left, or right)</div>
                    </div>
                    <p><strong>Movement Rules:</strong></p>
                    <ul>
                        <li>Moves <span class="highlight">one space</span> at a time</li>
                        <li>Can only move <span class="highlight">orthogonally</span> (up, down, left, right - not diagonally)</li>
                        <li>Must <span class="highlight">stay inside the Palace</span> (the 3×3 zone)</li>
                    </ul>
                    <p><strong>Flying General Rule:</strong> The two Generals can never face each other on the same column with no pieces between them. This is called "Flying General" and is an illegal position!</p>
                `
            },
            // Lesson 3: Advisors
            {
                title: "The Advisors",
                content: `
                    <h3>The Advisors (仕/士)</h3>
                    <p>Each side has <span class="highlight">two Advisors</span> that protect the General. They are also confined to the Palace.</p>
                    <p>Red's Advisors are <span class="highlight">仕 (Shì)</span> and Black's are <span class="highlight">士 (Shì)</span>.</p>
                    <div class="diagram-container">
                        <svg viewBox="0 0 200 200" width="200" height="200">
                            <!-- Mini palace -->
                            <rect x="20" y="20" width="160" height="160" fill="#f5deb3" rx="5"/>
                            <line x1="40" y1="40" x2="160" y2="40" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="40" y1="100" x2="160" y2="100" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="40" y1="160" x2="160" y2="160" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="40" y1="40" x2="40" y2="160" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="100" y1="40" x2="100" y2="160" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="160" y1="40" x2="160" y2="160" stroke="#c4a35a" stroke-width="1.5"/>
                            <line x1="40" y1="40" x2="160" y2="160" stroke="#c4a35a" stroke-width="1"/>
                            <line x1="160" y1="40" x2="40" y2="160" stroke="#c4a35a" stroke-width="1"/>

                            <!-- Move indicators (diagonal) -->
                            <circle cx="40" cy="40" r="12" class="move-indicator"/>
                            <circle cx="160" cy="40" r="12" class="move-indicator"/>
                            <circle cx="40" cy="160" r="12" class="move-indicator"/>
                            <circle cx="160" cy="160" r="12" class="move-indicator"/>

                            <!-- Advisor piece -->
                            <circle cx="100" cy="100" r="25" class="red-piece piece-circle"/>
                            <text x="100" y="108" text-anchor="middle" font-size="24" class="red-text">仕</text>
                        </svg>
                        <div class="diagram-caption">The Advisor moves one space diagonally along the palace lines</div>
                    </div>
                    <p><strong>Movement Rules:</strong></p>
                    <ul>
                        <li>Moves <span class="highlight">one space diagonally</span></li>
                        <li>Must <span class="highlight">stay inside the Palace</span></li>
                        <li>Can only occupy <span class="highlight">5 positions</span>: the center and four corners of the Palace</li>
                    </ul>
                    <p><strong>Strategy Tip:</strong> Advisors are primarily defensive pieces. Keep them near your General to form a protective formation!</p>
                `
            },
            // Lesson 4: Elephants
            {
                title: "The Elephants",
                content: `
                    <h3>The Elephants (相/象)</h3>
                    <p>Each side has <span class="highlight">two Elephants</span>. They are defensive pieces that cannot cross the river.</p>
                    <p>Red's Elephants are <span class="highlight">相 (Xiàng)</span> and Black's are <span class="highlight">象 (Xiàng)</span>.</p>
                    <div class="diagram-container">
                        <svg viewBox="0 0 280 280" width="280" height="280">
                            <!-- Board section -->
                            <rect x="20" y="20" width="240" height="240" fill="#f5deb3" rx="5"/>

                            <!-- Grid lines -->
                            ${[...Array(5)].map((_, i) => `<line x1="40" y1="${60 + i * 40}" x2="240" y2="${60 + i * 40}" stroke="#c4a35a" stroke-width="1.5"/>`).join('')}
                            ${[...Array(5)].map((_, i) => `<line x1="${60 + i * 40}" y1="60" x2="${60 + i * 40}" y2="220" stroke="#c4a35a" stroke-width="1.5"/>`).join('')}

                            <!-- Move indicators (2 spaces diagonal) -->
                            <circle cx="60" cy="60" r="12" class="move-indicator"/>

            document.getElementById('progressFill').style.width = `${progress}%`;

            renderLesson(currentLesson);

            currentLang = currentLang === 'en' ? 'zh' : 'en';
            updateUI();
        }

        document.getElementById('lessonNav').addEventListener('click', (e) => {

            } else {
                currentLesson++;
            }
            renderLesson(currentLesson);
        });

        document.getElementById('langToggle').addEventListener('click', toggleLanguage);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const currentLessons = getCurrentLessons();
            if (e.key === 'ArrowRight' && currentLesson < currentLessons.length - 1) {
                currentLesson++;
                renderLesson(currentLesson);
            } else if (e.key === 'ArrowLeft' && currentLesson > 0) {
                currentLesson--;
                renderLesson(currentLesson);
            }
        });
